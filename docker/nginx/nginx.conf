# Only bounded traffic classes are logged: never URLs, queries, headers or bodies.
map $uri $nodease_surface {
    default frontend;
    ~^/api api;
    ~^/ws websocket;
}
log_format nodease_metrics escape=json
    '{"nodease_access":true,"surface":"$nodease_surface",'
    '"method":"$request_method","status":$status,"duration":$request_time}';

server {
    listen 80;
    server_name localhost;
    access_log /dev/stdout nodease_metrics;

    # 클라이언트 최대 업로드 크기 (파일 업로드용)
    client_max_body_size 100M;

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public Webhook ingress: keep credentials out of access logs and stream the
    # body so the Gateway's end-to-end ingress deadline starts immediately.
    location /api/v1/hooks/ {
        access_log off;
        error_log /dev/null;
        client_max_body_size 1m;
        client_body_timeout 5s;
        proxy_request_buffering off;
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent Builder planner may use one semantic-repair call after the initial call.
    location ^~ /api/v1/agent-builder/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }

    # Connector tests carry credentials and open bounded outbound probes.
    location ~ ^/api/v1/connectors/test/?$ {
        access_log off;
        error_log /dev/null;
        client_max_body_size 32k;
        client_body_timeout 5s;
        proxy_request_buffering off;

        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 지원 (실시간 스트리밍용)
    location /ws {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 타임아웃 설정
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
