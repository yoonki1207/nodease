name: Test Model Routing Verification

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "codex/verify-model-routing-convergence"
    paths:
      - ".github/workflows/test-model-routing-verification.yml"
      - "apps/workflow_engine/tests/services/test_model_routing_verification_contract.py"
      - "scripts/model_routing_verification.py"
      - "scripts/model_routing_verification_cases.py"
      - "scripts/model_routing_verification_provider.py"
      - "tests/db/test_model_routing_activation_verification.py"
      - "tests/ci/test_model_routing_verification_workflow.py"
      - "tests/experiments/test_model_routing_verification.py"
      - "tests/experiments/test_model_routing_verification_cases.py"
      - "tests/experiments/test_model_routing_verification_runtime.py"
      - "tests/scripts/test_model_routing_verification_provider.py"

permissions:
  contents: read

jobs:
  model-routing-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      NODEASE_DISPOSABLE_DB_MAINTENANCE_DB: postgres
      NODEASE_RUN_DISPOSABLE_DB_TEST: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            apps/gateway/pyproject.toml
            apps/shared/pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: |
          uv venv .venv-ci-model-routing --python "3.11"
          uv pip install --python .venv-ci-model-routing/bin/python \
            -e apps/shared \
            -e "apps/gateway[dev]"

      - name: Run model routing verification contracts
        run: |
          mkdir -p artifacts
          .venv-ci-model-routing/bin/python -m pytest \
            apps/workflow_engine/tests/services/test_model_routing_verification_contract.py \
            tests/ci/test_model_routing_verification_workflow.py \
            tests/db/test_model_routing_activation_verification.py \
            tests/experiments/test_model_routing_verification.py \
            tests/experiments/test_model_routing_verification_cases.py \
            tests/experiments/test_model_routing_verification_runtime.py \
            tests/scripts/test_model_routing_verification_provider.py \
            --junitxml=artifacts/model-routing-verification.junit.xml \
            -q

      - name: Upload machine-readable verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-routing-verification-junit
          path: artifacts/model-routing-verification.junit.xml
          if-no-files-found: error
          retention-days: 14
